name: Release

# Automatic release pipeline (HANDOFF.md §16):
#   push a version tag (git tag v0.1.0 && git push origin v0.1.0)
#   -> preflight validates the tag
#   -> the full Flutter test suite runs first; a failure blocks the release
#   -> only a green test run builds the Windows executable bundle
#   -> portable .zip, setup .exe installer, checksums, and Windows test
#      results are attached to a GitHub Release
#
# Windows-only by scope decision for now (interim, recorded in HANDOFF.md §16
# and tasks/BACKLOG.md); macOS/Linux packaging returns in Phase 5.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version ${VERSION}"
          test -n "$VERSION"

  build-windows:
    name: Test and build Windows
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8 # pinned, see ADR 0005
          cache: true
      - name: Run Windows tests and capture output
        shell: pwsh
        run: |
          cd apps/desktop
          flutter pub get
          flutter test --reporter expanded 2>&1 | Tee-Object -FilePath ..\..\DevKit-Windows-test-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows release
        shell: pwsh
        run: |
          cd apps/desktop
          flutter build windows --release
      - name: Package Windows output (portable zip)
        shell: pwsh
        run: |
          $source = "apps/desktop/build/windows/x64/runner/Release"
          if (!(Test-Path $source)) { $source = "apps/desktop/build/windows/runner/Release" }
          if (!(Test-Path $source)) { Write-Error "Windows build output not found." }
          Compress-Archive -Path "$source/*" -DestinationPath "DevKit-Windows-x64.zip"
      - name: Build Windows setup installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { Write-Error "ISCC.exe not found after install." }
          $version = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $Matches[1] } else { "0.1.0" }
          & $iscc /DAPP_VERSION=$version packaging\windows\devkit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DevKit-Windows-x64
          path: DevKit-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DevKit-Windows-setup
          path: packaging/windows/Output/DevKit-Windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DevKit-Windows-test-results
          path: DevKit-Windows-test-results.txt

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      # Contains DevKit-Windows-x64.zip (portable), DevKit-Windows-x64-setup.exe
      # (installer), and DevKit-Windows-test-results.txt.
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
