name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-schemas:
    name: Docs and JSON schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate schemas and examples
        run: |
          python -m pip install --quiet jsonschema
          python scripts/validate_schemas.py

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Check workspace exists
        run: |
          if [ -f Cargo.toml ]; then
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace --all-targets
          else
            echo "Rust workspace not scaffolded yet; Phase 0 docs-only check."
          fi

  # Guards the FFI contract: generated Dart must match committed codegen
  # output. A diff here means bridge code was hand-edited or codegen was not
  # rerun after a Rust change (contracts update in the same commit).
  codegen-drift:
    name: Bridge codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # FRB codegen detects a Flutter project (apps/desktop/pubspec.yaml
      # declares a `flutter` dependency) and therefore requires the full
      # Flutter toolchain, not Dart alone: it runs `flutter --version` and
      # `flutter pub get` (dart_toolchain.rs `DartToolchain::available()`).
      # A Dart-only environment makes the codegen binary abort (exit 101).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Same pinned version as the flutter job (ADR 0005).
          flutter-version: 3.47.8
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen@2.13.0 --locked
      - name: Regenerate and diff
        env:
          # Print a backtrace if the codegen binary still panics.
          RUST_BACKTRACE: 1
        run: |
          (cd apps/desktop && flutter pub get)
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- crates/devkit-bridge apps/desktop/lib/core/bridge

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version verified locally (ADR 0005): keeps CI
          # deterministic and analyzer behavior identical to local runs.
          flutter-version: 3.47.8
          cache: true
      - name: Check Flutter project exists
        run: |
          if [ -f apps/desktop/pubspec.yaml ]; then
            cd apps/desktop
            flutter pub get
            # Vendored cargokit code (rust_builder/cargokit) is third-party and
            # excluded from formatting and analysis.
            dart format --output=none --set-exit-if-changed lib test
            flutter analyze
            flutter test
          else
            echo "Flutter app not scaffolded yet; Phase 0 docs-only check."
          fi

  django:
    name: Django checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/catalog-api/requirements.txt
      - name: Check Django service exists
        run: |
          if [ -f services/catalog-api/manage.py ]; then
            python -m pip install -r services/catalog-api/requirements.txt
            cd services/catalog-api
            python manage.py check
            python manage.py test
          else
            echo "Django API not scaffolded yet; Phase 0 docs-only check."
          fi

  # Phase 1 definition of done (docs/phases/PHASE_1.md § Definition of done):
  # "flutter analyze + flutter test and cargo clippy/test pass on all
  # platforms in CI" and "CI smoke on macOS". The ubuntu jobs above cover
  # Linux; this job repeats the same checks on macOS. It is not the
  # packaging pipeline (release.yml) — no builds or installers here.
  macos-smoke:
    name: macOS smoke (Rust + Flutter checks)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Rust checks
        working-directory: crates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
      - name: Flutter checks
        working-directory: apps/desktop
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
