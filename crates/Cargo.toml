[workspace]
resolver = "2"
members = ["devkit-core", "devkit-bridge", "devkit-registry", "devkit-catalog", "devkit-jobs", "devkit-download", "devkit-install"]

# Phase 0 note: HANDOFF.md section 7 lists a recommended multi-crate layout.
# Per the "avoid premature micro-crates" rule, Phase 0 scaffolds devkit-core
# only. New crates are extracted when a module gains an independent boundary
# (see ADR 0002 and docs/architecture/version-management.md). devkit-registry
# and devkit-catalog follow the documented split (HANDOFF.md §7,
# docs/architecture/local-database.md §3: migrations live in devkit-registry).

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.42", features = ["bundled"] }
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
# ADR 0002: reqwest over rustls (no OpenSSL), HTTPS-only policy enforced by
# the client. Used by the remote catalog client (P2-04) and, later, the
# download engine (Phase 3).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Test runtime for async engine code (macrotasks); production async runs on
# the bridge's executor. "time" supports deterministic cancellation-timing
# sleeps in the P3-01 download tests.
tokio = { version = "1", features = ["macros", "rt", "time"] }
# P3-01: SHA-256 verification of downloaded artifacts (security model §4).
sha2 = "0.10"
# P3-01: chunk type for streamed download bodies.
bytes = "1"
# P3-01 tests: local fixture HTTP server (testing-strategy.md - download
# tests never touch real vendor hosts).
tiny_http = "0.12"
# P3-02 archive adapter: managed ZIP and TAR(+gzip) extraction.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# P3-02 tests: property-style entry-path validation (testing-strategy.md
# "Property/fuzz" row).
proptest = "1"
